services:
  # Main web service (Django app)
  - type: web
    name: trapick-cloud
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: ./build.sh
    startCommand: "gunicorn trapick.wsgi:application --bind 0.0.0.0:$PORT"
    
    envVars:
      - key: DEPLOYMENT_ENV
        value: cloud
      
      - key: DEBUG
        value: "False"
      
      - key: SECRET_KEY
        generateValue: true
        
      - key: SYNC_API_KEY
        generateValue: true
      
      - key: PYTHON_VERSION
        value: "3.9.2"
      
      - key: WEB_CONCURRENCY
        value: "2"
      
      # This is the critical line - it links your database
      - key: DATABASE_URL
        fromDatabase:
          name: trapick-db
          property: connectionString
    
    healthCheckPath: /api/health/

databases:
  - name: trapick-db
    plan: free
    databaseName: trapickdb
    user: trapickuser
    region: oregon