services:
  # Main web service (Django app)
  - type: web
    name: trapick-cloud
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: |
      # Disable CI mode to allow warnings during build
      export CI=false
      # Build React frontend first
      cd frontend
      npm ci
      npm run build
      cd ..
      # Then build Django app
      ./build.sh
    startCommand: "gunicorn trapick.wsgi:application --bind 0.0.0.0:$PORT"
    
    envVars:
      - key: DEPLOYMENT_ENV
        value: cloud
      
      - key: DEBUG
        value: "False"
      
      - key: SECRET_KEY
        generateValue: true
        
      - key: SYNC_API_KEY
        generateValue: true
      
      - key: PYTHON_VERSION
        value: "3.9.2"  # Match your local Python version
      
      - key: WEB_CONCURRENCY
        value: "2"
    
    healthCheckPath: /api/health/

databases:
  - name: trapick-db
    plan: free
    databaseName: trapickdb
    user: trapickuser
    region: oregon