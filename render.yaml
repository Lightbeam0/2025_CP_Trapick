services:
  - type: web
    name: trapick-cloud
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: |
      # Build React frontend first
      cd frontend
      npm ci
      npm run build
      cd ..
      # Then build Django app
      ./build.sh
    startCommand: "gunicorn trapick.wsgi:application --bind 0.0.0.0:$PORT"
    
    envVars:
      - key: DEPLOYMENT_ENV
        value: cloud
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SYNC_API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.9.2"
      - key: WEB_CONCURRENCY
        value: "2"
    
    healthCheckPath: /api/health/